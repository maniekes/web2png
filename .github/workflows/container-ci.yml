name: Container compatibility CI
on:
  push:
    branches: [feat/containerize-web2png, feat/publish-ghcr, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: container-ci-${{ github.ref }}
  # Never cancel a master push midway through publishing the two tags.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  test:
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'maniekes/web2png')"
    permissions:
      contents: read
    uses: ./.github/workflows/container-build.yml
    with:
      publish: false
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'maniekes/web2png'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-build.yml
    with:
      publish: true
